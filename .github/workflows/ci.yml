name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Core + Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core and server
        run: ./gradlew -Pdrops.serverOnly=true :core:jvmTest :server:test

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test shared data layer and build the app
        run: ./gradlew :data:jvmTest :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: drops-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
