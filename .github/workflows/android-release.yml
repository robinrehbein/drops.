name: Android release

# main  -> signed release APK + AAB as workflow artifacts (and Play internal track if configured)
# v*    -> additionally a GitHub Release with the APK/AAB attached

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - androidApp/**
      - data/**
      - core/**
      - gradle/**
      - "*.gradle.kts"
      - gradle.properties
      - .github/workflows/android-release.yml
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    env:
      DROPS_VERSION_CODE: ${{ github.run_number }}
      DROPS_SYNC_URL: ${{ vars.SYNC_URL }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "DROPS_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "DROPS_VERSION_NAME=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set – building an unsigned release."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "DROPS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "DROPS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "DROPS_KEY_ALIAS=$KEY_ALIAS"
            echo "DROPS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Test and build
        run: ./gradlew :data:jvmTest :androidApp:assembleRelease :androidApp:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: drops-${{ env.DROPS_VERSION_NAME }}
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab

      - name: Upload to Google Play (internal track)
        if: env.HAS_PLAY_ACCOUNT == 'true' && env.DROPS_KEYSTORE_PATH != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.birneklub.drop
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          track: internal
          status: draft

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab
          generate_release_notes: true
