name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag (z. B. v2.1.0) — wird erstellt, falls er noch nicht existiert"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Keystore aus Secret entpacken (falls vorhanden)
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Release-APK bauen
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            echo "Signiere mit Release-Keystore aus Secrets."
          else
            echo "Keine Signing-Secrets gefunden — APK wird debug-signiert."
          fi
          ./gradlew assembleRelease

      - name: APK benennen
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          VERSION="${TAG_INPUT:-$GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "Drops-$VERSION.apk"
          echo "APK_NAME=Drops-$VERSION.apk" >> "$GITHUB_ENV"

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ env.APK_NAME }}
          generate_release_notes: true

      - name: APK als Artefakt hochladen (manueller Lauf ohne Tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: drops-release-apk
          path: ${{ env.APK_NAME }}
