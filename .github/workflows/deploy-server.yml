name: Deploy server

# Builds the sync server image, pushes it to GitHub Container Registry and
# tells Coolify to redeploy. Coolify pulls ghcr.io/<owner>/drops-server:latest.

on:
  push:
    branches: [main]
    paths:
      - core/**
      - server/**
      - gradle/**
      - "*.gradle.kts"
      - gradle.properties
      - .dockerignore
      - .github/workflows/deploy-server.yml
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Pdrops.serverOnly=true :core:jvmTest :server:test

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/drops-server" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::warning::COOLIFY_WEBHOOK / COOLIFY_TOKEN not set – image was pushed, deployment skipped."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
      - name: Wait for health check
        env:
          SYNC_URL: ${{ vars.SYNC_URL }}
        run: |
          if [ -z "$SYNC_URL" ]; then echo "SYNC_URL variable not set – skipping health check."; exit 0; fi
          for i in $(seq 1 30); do
            if curl -fsS "$SYNC_URL/healthz"; then echo; echo "Server healthy"; exit 0; fi
            sleep 10
          done
          echo "::error::Server did not become healthy at $SYNC_URL/healthz"
          exit 1
