appId: com.brewlog.app
name: Recover from mid-pull kill
---
- launchApp:
    clearState: false
- tapOn: "Lab"
- tapOn: "Pick a bean ▾"
- tapOn: "Maestro Test Bean"
- tapOn: "Start Shot"
- assertVisible: "Stop Pull"
- stopApp
- launchApp
- tapOn: "Lab"
- assertVisible: "In-progress shot from"
- tapOn: "Resume"
- assertVisible: "Stop Pull"
- tapOn: "Stop Pull"
- assertVisible: "Log this shot"
- tapOn: "Save"
