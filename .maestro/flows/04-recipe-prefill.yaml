appId: com.brewlog.app
name: Recipe prefill from saved shot
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: "Library"
- tapOn: "Add a bean"
- inputText: "Recipe Prefill Bean"
- tapOn: "Save bean"
- tapOn: "Lab"
- tapOn: "Pick a bean ▾"
- tapOn: "Recipe Prefill Bean"
- tapOn: "Start Shot"
- assertVisible: "Stop Pull"
- tapOn: "Stop Pull"
- assertVisible: "Log this shot"
- tapOn: "4"
- tapOn: "Save"
- assertVisible: "History"
- tapOn: "Recipe Prefill Bean"
- tapOn: "Save as recipe for Recipe Prefill Bean"
- assertVisible: "Save as recipe"
- tapOn: "Save recipe"
- tapOn: "Lab"
- tapOn: "Pick a bean ▾"
- tapOn: "Recipe Prefill Bean"
- assertVisible: "Recipe locked"

