<title>drops. App-Prototyp</title>

<style>
:root{
  --bg:#F3EEE5;--surface:#FBF8F3;--ink:#1E1915;--muted:#62574D;--line:#E0D6C8;--track:#EAE1D4;
  --accent:#A4521E;--accent-ink:#7E3C12;--on-accent:#FBF8F3;
  --hero:#2A211B;--hero-ink:#F6EFE6;--hero-muted:#BFB2A4;--hero-line:#43372E;--hero-accent:#E08A4F;--hero-faint:#8F8275;
  --ok:#3E6A55;--ok-soft:#DCE8DF;--ok-ink:#23473A;--warn:#A4521E;--warn-soft:#F1DFD0;--bad:#9B2C20;--bad-soft:#F4D9D3;
  --ice:#2F5064;--ice-soft:#DDE6EC;--inv:#1E1915;--on-inv:#FBF8F3;
  --sea:#E4EAE8;--land:#F7F2EA;--land-line:#CFC4B4;--park:#E3EBDD;--belt:rgba(164,82,30,.08);
  --shadow:0 8px 24px rgba(42,33,27,.18);
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#16110E;--surface:#201915;--ink:#F2E9DF;--muted:#AE9F90;--line:#382D26;--track:#2E251F;
  --accent:#E08A4F;--accent-ink:#F0A673;--on-accent:#1E1915;
  --hero:#2B211B;--hero-line:#453830;
  --ok:#7FB39A;--ok-soft:#1F3029;--ok-ink:#A9D3BE;--warn:#E08A4F;--warn-soft:#3A2618;--bad:#E88A7C;--bad-soft:#3A1C18;
  --ice:#9CC0D6;--ice-soft:#1D2A33;--inv:#F2E9DF;--on-inv:#1E1915;
  --sea:#1A2123;--land:#2A221D;--land-line:#4A3E35;--park:#232B22;--belt:rgba(224,138,79,.10);--shadow:0 8px 24px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16110E;--surface:#201915;--ink:#F2E9DF;--muted:#AE9F90;--line:#382D26;--track:#2E251F;
  --accent:#E08A4F;--accent-ink:#F0A673;--on-accent:#1E1915;
  --hero:#2B211B;--hero-line:#453830;
  --ok:#7FB39A;--ok-soft:#1F3029;--ok-ink:#A9D3BE;--warn:#E08A4F;--warn-soft:#3A2618;--bad:#E88A7C;--bad-soft:#3A1C18;
  --ice:#9CC0D6;--ice-soft:#1D2A33;--inv:#F2E9DF;--on-inv:#1E1915;
  --sea:#1A2123;--land:#2A221D;--land-line:#4A3E35;--park:#232B22;--belt:rgba(224,138,79,.10);--shadow:0 8px 24px rgba(0,0,0,.45);
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:28px 20px 32px;display:flex;flex-direction:column;gap:20px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-weight:400}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1.title{margin:0;font:400 40px/1 var(--serif);letter-spacing:-.01em;text-wrap:balance}
h2,h3{margin:0}
.h-sec{font-size:15px;font-weight:600}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.link{background:none;border:none;padding:0;color:var(--accent);font-weight:500;font-size:14px;min-height:32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.list>*+*{border-top:1px solid var(--line)}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px}
.hero .eyebrow{color:var(--hero-accent)}
.hero .hm{color:var(--hero-muted)}
.btn{height:52px;border-radius:26px;border:none;padding:0 22px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-hero{background:var(--hero-accent);color:#1E1915}
.btn-ink{background:var(--inv);color:var(--on-inv)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn-ghost-hero{background:transparent;border:1px solid #5A4A3E;color:var(--hero-ink);font-weight:500}
.btn-sm{height:40px;border-radius:20px;padding:0 14px;font-size:13px;font-weight:500}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:transparent;font-size:14px;white-space:nowrap;flex-shrink:0}
.chip[aria-pressed="true"]{background:var(--inv);color:var(--on-inv);border-color:var(--inv);font-weight:500}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--track);border-radius:14px;padding:4px}
.seg button{min-height:44px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-weight:500;font-size:14px;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(42,33,27,.15)}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.ibox{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tabbar{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:none;background:none;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500}
.tabbar button[aria-current="page"]{color:var(--accent)}
.fab{position:absolute;right:20px;bottom:96px;width:60px;height:60px;border-radius:30px;border:none;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:5}
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:11px}
.stat .v{font-family:var(--mono);font-size:18px}
.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--inv);color:var(--on-inv);padding:12px 18px;border-radius:22px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.field{display:flex;flex-direction:column;gap:2px;background:var(--surface);padding:10px 14px}
.field span{font-size:12px;color:var(--muted)}
.field input,.field select{border:none;background:transparent;padding:0;outline:none;font-size:15px;min-height:24px;width:100%}
.fields{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.fields .grid2{gap:1px}
.bag{width:52px;height:64px;border-radius:10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;flex-shrink:0}
.beanrow{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:14px;display:flex;gap:14px;align-items:center}
.tag{padding:6px 12px;border-radius:14px;border:1px solid #5A4A3E;font-size:13px}
.stars{display:flex;gap:2px}
.stars button{width:40px;height:44px;border:none;background:none;padding:0;color:var(--accent);display:flex;align-items:center;justify-content:center}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 14px}
.stepper .btns{display:flex;flex-direction:column;gap:4px}
.stepper .btns button{width:44px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:17px;line-height:1}
.hint{display:flex;gap:12px;align-items:flex-start;background:var(--ok-soft);color:var(--ok-ink);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.4}
.mapwrap{position:relative;height:300px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sea);touch-action:none;overflow:hidden}
.mapwrap svg{width:100%;height:100%;display:block;cursor:grab}
.mapwrap svg:active{cursor:grabbing}
.mapctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;box-shadow:0 2px 6px rgba(42,33,27,.12)}
.osm{position:absolute;right:6px;bottom:4px;font-size:10px;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:1px 4px;border-radius:4px}
.maplegend{position:absolute;left:12px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12px;color:var(--muted)}
.bubble{position:absolute;left:12px;bottom:12px;right:64px;background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.pinrow{width:100%;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 10px;border:none;border-radius:14px;background:transparent;text-align:left}
.pinrow[aria-pressed="true"]{background:var(--surface)}
.dot{width:10px;height:10px;border-radius:5px;background:var(--accent);flex-shrink:0}
.pinrow[aria-pressed="true"] .dot{background:var(--inv)}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scroll-padding-inline:20px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.rec{width:250px;flex-shrink:0;scroll-snap-align:start;padding:16px;display:flex;flex-direction:column;gap:10px}
.overlay{position:absolute;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- Pflege-Logik ---------- */
function taskState(t){
  var used = t.unit==='d' ? days(new Date(t.last+'T08:00:00'),TODAY) : S.machine.kg - t.lastKg;
  var pct = used/t.every, left=t.every-used;
  var st = pct>=1?'over':pct>=0.8?'soon':'ok';
  var unitWord = t.unit==='d'?(Math.abs(Math.round(left))===1?' Tag':' Tagen'):' kg';
  var status = st==='over'
    ? (t.unit==='d'? Math.round(-left)+(Math.round(-left)===1?' Tag':' Tage')+' über' : de(-left)+' kg über')
    : (t.unit==='d'? (Math.round(left)===0?'heute':'in '+Math.round(left)+unitWord) : 'in '+de(left)+' kg');
  return {t:t,used:used,pct:pct,st:st,status:status};
}
var STCOL={over:['var(--bad)','var(--bad-soft)'],soon:['var(--warn)','var(--warn-soft)'],ok:['var(--ok)','var(--ok-soft)']};
function sortedTasks(){return S.tasks.map(taskState).sort(function(a,b){return b.pct-a.pct;});}

/* ---------- Karten-Projektionen ---------- */
function projW(lat,lon){var r=Math.PI/180;return [GEO.w.t[0]+GEO.w.k*lon*r, GEO.w.t[1]-GEO.w.k*lat*r];}
function projE(lat,lon){var r=Math.PI/180;return [GEO.e.t[0]+GEO.e.k*lon*r, GEO.e.t[1]-GEO.e.k*Math.log(Math.tan(Math.PI/4+lat*r/2))];}

function dialChart(shots){
  var W=320,H=130,pl=34,pr=10,pt=14,pb=26;
  var gs=shots.map(function(s){return s.grind;}),mn=Math.floor(Math.min.apply(0,gs)*2)/2-0.5,mx=Math.ceil(Math.max.apply(0,gs)*2)/2+0.5;

  var ticks=[mx,(mx+mn)/2,mn];

function fitView(pins,minW){

function palate(){
  var cats={Floral:['Jasmin','Rose','Hibiskus','Bergamotte','Earl Grey'],Fruchtig:['Pfirsich','Weißer Pfirsich','Cassis','Litschi','Mandarine','Erdbeere','Blaubeere','Zitrone','Orange','Pflaume','Apfel','Rosine','Tomate'],'Süße':['Honig','Karamell','Rohrzucker','Brauner Zucker'],Schokolade:['Kakao','Milchschokolade','Haselnuss']};
  var sc={},max=0;
  Object.keys(cats).forEach(function(c){sc[c]=0;});
  S.beans.forEach(function(b){if(!b.rating)return;var w=Math.max(0,b.rating-2.5);b.notes.forEach(function(n){Object.keys(cats).forEach(function(c){if(cats[c].indexOf(n)>=0)sc[c]+=w;});});});
  Object.keys(sc).forEach(function(c){max=Math.max(max,sc[c]);});
  var reg={Afrika:[],Amerika:[]},AF=['Äthiopien','Kenia','Ruanda','Burundi'];
  S.beans.forEach(function(b){if(b.rating)(AF.indexOf(b.country)>=0?reg.Afrika:reg.Amerika).push(b.rating);});
  var avg=function(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;};
  var washed=S.beans.filter(function(b){return b.rating&&b.process==='Washed';}),other=S.beans.filter(function(b){return b.rating&&b.process!=='Washed';});
  var top=Object.keys(sc).sort(function(a,b){return sc[b]-sc[a];});
  var sentence=(avg(washed.map(function(b){return b.rating;}))>=avg(other.map(function(b){return b.rating;}))?'Gewaschen':'Natural & Honey')+', '+top[0].toLowerCase()+' und '+top[1].toLowerCase()+'. '+(avg(reg.Afrika)>=avg(reg.Amerika)?'Ostafrika':'Lateinamerika')+' holt bei dir die besten Noten.';
  return {sc:sc,max:max||1,sentence:sentence};
}

  var h='<span class="small muted">Auf Basis von '+rated+' bewerteten Röstungen und '+S.shots.length+' geloggten Shots. Tippe auf einen Eintrag, um ihn auf der Karte zu sehen.</span>';
  h+='<section class="hero" style="gap:14px"><span class="eyebrow">Dein Gaumen</span><p class="serif" style="margin:0;font-size:24px;line-height:1.15;text-wrap:balance">'+esc(p.sentence)+'</p>'+
    '<div style="display:grid;grid-template-columns:84px 1fr;gap:8px 12px;align-items:center;font-size:12px" class="hm">'+Object.keys(p.sc).map(function(k){var w=p.sc[k]/p.max*100;return '<span>'+k+'</span><div style="height:6px;border-radius:3px;background:var(--hero-line)"><div style="width:'+Math.max(4,w)+'%;height:6px;border-radius:3px;background:'+(w>=50?'var(--hero-accent)':'var(--hero-faint)')+'"></div></div>';}).join('')+'</div></section>';
  h+='<section style="display:flex;flex-direction:column;gap:12px"><div class="between"><h2 style="font-size:17px;font-weight:600">Könnte dir schmecken</h2><span class="small muted">'+RECS.length+' Vorschläge</span></div><div class="hscroll">'+
    RECS.map(function(r){var sv=!!S.saved[r.id],on=sel==='r:'+r.id;return '<article class="card rec" style="'+(on?'border-color:var(--ink)':'')+'"><button class="link" style="text-align:left;padding:0;color:var(--muted);font-size:12px;min-height:24px" data-act="focus" data-v="r:'+r.id+'">'+ic('pin',14)+' '+esc(r.roaster)+', '+esc(r.city)+'</button><span class="eyebrow">'+esc(r.country)+' · '+esc(r.region)+'</span><span class="serif" style="font-size:26px;line-height:1">'+esc(r.name)+'</span><span class="small muted">'+esc(r.roaster)+' · '+esc(r.process)+' · '+esc(r.notes)+'</span><div class="hint" style="font-size:12px;padding:8px 10px;border-radius:12px">'+esc(r.why)+'</div><div class="between" style="align-items:center"><span class="mono small">'+esc(r.price)+'</span><button class="link" data-act="saverec" data-v="'+r.id+'" aria-pressed="'+sv+'">'+(sv?'Gemerkt ✓':'Merken')+'</button></div></article>';}).join('')+'</div></section>';
  var f=UI.cafeFilter;
  var cafes=CAFES.filter(function(c){return f==='open'?c.open:c.kind.indexOf(f)>=0;});
  h+='<section style="display:flex;flex-direction:column;gap:12px"><div class="between"><h2 style="font-size:17px;font-weight:600">In deiner Nähe</h2><span class="small muted">Beispiel: Hamburg-Ottensen</span></div>'+
    '<div class="chips">'+[['cafe','Cafés'],['roaster','Röstereien'],['open','Jetzt offen']].map(function(c){return '<button class="chip" data-act="cafefilter" data-v="'+c[0]+'" aria-pressed="'+(f===c[0])+'">'+c[1]+'</button>';}).join('')+'</div>'+
    '<div class="card list">'+cafes.map(function(c){var on=sel==='c:'+c.name;return '<button class="row" data-act="focus" data-v="c:'+esc(c.name)+'" style="width:100%;border:none;text-align:left;padding:14px 16px;align-items:flex-start;background:'+(on?'var(--bg)':'transparent')+'"><div class="ibox" style="width:48px;height:48px;border-radius:14px;background:'+(c.open?'var(--warn-soft)':'var(--track)')+';color:'+(c.open?'var(--accent)':'var(--muted)')+'">'+ic(c.kind[0]==='roaster'?'grinder':'coffee',22,1.8)+'</div>'+
      '<div style="flex:1;display:flex;flex-direction:column;gap:3px;min-width:0"><div class="between"><span style="font-weight:600">'+esc(c.name)+'</span><span class="mono small muted">'+(c.dist<1?Math.round(c.dist*1000)+' m':de(c.dist)+' km')+'</span></div><span class="small muted">'+esc(c.desc)+'</span><span class="small" style="font-weight:500;color:'+(c.open?'var(--ok)':'var(--muted)')+'">'+esc(c.hours)+(c.extra?' · '+esc(c.extra):'')+'</span></div></button>';}).join('')+'</div></section>';
  h+='<section style="display:flex;flex-direction:column;gap:12px"><h2 style="font-size:17px;font-weight:600">Auf Reisen</h2><div class="grid2">'+CITIES.map(function(c){return '<button class="card" data-act="focus" data-v="t:'+c.name+'" style="'+(sel==='t:'+c.name?'border-color:var(--ink);':'')+'padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left"><span class="serif" style="font-size:24px;line-height:1">'+c.name+'</span><span class="small muted">'+c.cafes+' Cafés · '+c.roasters+' Röstereien</span></button>';}).join('')+'</div></section>';
  return h;
}

/* Setup & Pflege */
function vSetup(){
  var ts=sortedTasks(),over=ts.filter(function(x){return x.st==='over';}).length,m=S.machine;
  var h='<div class="pad"><div class="between" style="align-items:flex-end"><h1 class="title">Setup</h1><span class="mono small" style="color:'+(over?'var(--bad)':'var(--ok)')+'">'+(over?over+' überfällig':'Alles im grünen Bereich')+'</span></div>';
  var dev=function(icn,t,sub,v,k){return '<div class="hero" style="padding:16px;gap:12px;border-radius:20px"><span style="color:var(--hero-accent)">'+ic(icn,28,1.6)+'</span><div style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:600">'+t+'</span><span class="hm" style="font-size:12px">'+esc(sub)+'</span></div><div style="display:flex;flex-direction:column;gap:2px"><span class="mono" style="font-size:20px">'+v+'</span><span class="hm" style="font-size:11px">'+k+'</span></div></div>';};
  h+='<div class="grid2">'+dev('machine','Maschine',m.name,m.shots.toLocaleString('de-DE'),'Shots gesamt')+dev('grinder','Mühle',m.grinder,de(m.kg)+' kg','gemahlen')+'</div>';
  h+='<div class="card row" style="padding:12px 14px;gap:10px"><span style="color:var(--ice)">'+ic('drop',20)+'</span><span style="flex:1;font-size:14px">Wasser: Leitung '+m.hard+' °dH → Filter <span class="mono">'+m.filtered+' °dH</span></span><button class="link" data-act="measure">Messen</button></div>';
  h+='<div class="between" style="margin-top:4px"><h2 style="font-size:17px;font-weight:600">Pflegeplan</h2><span class="small muted">nach Dringlichkeit</span></div>';
  h+='<div style="display:flex;flex-direction:column;gap:10px">'+ts.map(function(x){return '<div class="card">'+taskRow(x,false)+'</div>';}).join('')+'</div>';
  h+='<button class="btn btn-ghost" data-act="reset" style="margin-top:8px">Beispieldaten zurücksetzen</button>';
  return h+'</div>';
}

/* Neue Bohne */
function vAdd(){
  var f=UI.addForm;
  var h='<div class="pad" style="gap:16px"><div class="topbar"><button class="link" style="font-size:15px;min-height:44px" data-act="back">Abbrechen</button><span style="font-weight:600">Neue Bohne</span><span style="width:72px"></span></div>';
  h+='<label for="labelimg" class="hero" style="padding:0;height:150px;position:relative;align-items:center;justify-content:center;overflow:hidden;cursor:pointer">'+
     '<div style="width:140px;height:106px;border-radius:8px;background:#EFE4D2;transform:rotate(-4deg);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:14px"><span class="serif" style="font-size:17px;color:#2A211B">'+esc(f.name||'Etikett')+'</span><span style="height:4px;width:86px;background:#C9B89F;border-radius:2px"></span><span style="height:4px;width:64px;background:#C9B89F;border-radius:2px"></span></div>'+
     '<span style="position:absolute;left:12px;bottom:12px;height:30px;padding:0 12px;border-radius:15px;background:'+(f.scanned?'#3E6A55':'#43372E')+';color:#F6EFE6;font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px">'+ic('camera',14)+(f.scanned?'6 Felder vom Etikett erkannt':'Foto vom Etikett wählen')+'</span>'+
     '<input id="labelimg" type="file" accept="image/*" style="position:absolute;opacity:0;width:1px;height:1px"></label>';
  var inp=function(id,label,val,cls,type){return '<label class="field" for="f-'+id+'"><span>'+label+'</span><input id="f-'+id+'" data-f="'+id+'" '+(type?'type="'+type+'" ':'')+'value="'+esc(val)+'"'+(cls?' class="'+cls+'"':'')+'></label>';};
  h+='<div class="fields">'+inp('name','Name',f.name)+inp('roaster','Rösterei',f.roaster)+
    '<div class="grid2"><label class="field" for="f-country"><span>Land</span><select id="f-country" data-f="country">'+Object.keys(COUNTRIES).map(function(c){return '<option'+(c===f.country?' selected':'')+'>'+c+'</option>';}).join('')+'</select></label>'+inp('region','Region',f.region)+
    inp('roastDate','Röstdatum',f.roastDate,'mono','date')+inp('weight','Menge (g)',f.weight,'mono','number')+inp('price','Preis (€)',f.price,'mono','number')+inp('notes','Aromen',f.notes)+'</div></div>';
  h+='<div style="display:flex;flex-direction:column;gap:8px"><span class="small muted">Aufbereitung</span><div class="chips" style="flex-wrap:wrap;margin:0;padding:0">'+['Washed','Natural','Honey','Anaerob'].map(function(p){return '<button class="chip" data-act="proc" data-v="'+p+'" aria-pressed="'+(f.process===p)+'">'+p+'</button>';}).join('')+'</div></div>';
  h+='<div style="display:flex;flex-direction:column;gap:8px"><span class="small muted">Gekauft bei</span><div class="card row" style="padding:12px 14px"><span style="color:var(--accent)">'+ic('pin',20)+'</span><label for="f-city" style="flex:1;display:flex;flex-direction:column;min-width:0"><select id="f-city" data-f="city" style="border:none;background:transparent;font-weight:500;padding:0;outline:none">'+Object.keys(CITYPOS).map(function(c){return '<option'+(c===f.city?' selected':'')+'>'+c+'</option>';}).join('')+'</select><span class="muted" style="font-size:12px">'+esc(f.roaster||'Rösterei')+' · '+f.how+'</span></label>'+
    '<div class="seg" style="width:150px"><button data-act="how" data-v="vor Ort" aria-pressed="'+(f.how==='vor Ort')+'">Vor Ort</button><button data-act="how" data-v="online" aria-pressed="'+(f.how==='online')+'">Online</button></div></div></div>';
  h+='<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><button class="btn btn-ink" data-act="addsave">Speichern &amp; öffnen</button><span class="small muted" style="text-align:center">Startwert Mahlgrad aus ähnlicher Bohne: <span class="mono">'+fmt(similarGrind(f))+'</span></span></div>';
  return h+'</div>';
}
function similarGrind(f){var m=S.beans.filter(function(b){return b.recipes[0]&&b.process===f.process;});if(!m.length)m=S.beans.filter(function(b){return b.recipes[0];});var a=m.reduce(function(s,b){return s+b.recipes[0].grind;},0)/m.length;return Math.round(a*4)/4;}

/* ---------- Render ---------- */
function render(keepScroll){
  var v=document.getElementById('view'),top=v.scrollTop;
  var fn={home:vHome,beans:vBeans,bean:vBean,map:vMap,setup:vSetup,shot:vShot,add:vAdd}[UI.route];
  v.innerHTML=fn();
  renderTabs();
  if(keepScroll)v.scrollTop=top;else v.scrollTop=0;
  if(UI.route==='map')bindMap();
  var q=document.getElementById('q');
  if(q){q.addEventListener('input',function(){UI.q=q.value;var pos=q.selectionStart;render(true);var n=document.getElementById('q');n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}});}
}
function go(r){UI.prev=UI.route;UI.route=r;if(r==='map')UI.vb=null;render();}

document.getElementById('app').addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  var b=UI.beanId&&bean(UI.beanId);
  switch(a){
    case 'tab': case 'go': go(v);break;
    case 'bean': UI.beanId=v;UI.recipeIdx=0;UI.prev=UI.route==='bean'?UI.prev:UI.route;UI.route='bean';render();break;
    case 'back': UI.route=UI.prev&&UI.prev!==UI.route&&UI.prev!=='shot'&&UI.prev!=='add'?UI.prev:'beans';render();break;
    case 'recipe': UI.recipeIdx=+v;render(true);break;
    case 'newrecipe': var base=b.recipes[0]||{grind:similarGrind(b),rpm:1200,dose:18,out:36,tmin:26,tmax:30,temp:93,pre:'5 s',kit:'Sieb 18 g'};b.recipes.push(Object.assign({},base,{name:'Rezept '+(b.recipes.length+1)}));UI.recipeIdx=b.recipes.length-1;save();render(true);toast('Rezept angelegt');break;
    case 'rate': var n=+v;b.rating=b.rating===n?n-0.5:n;save();render(true);break;
    case 'rebuy': b.rebuy=v==='1';save();render(true);break;
    case 'rebuyNow': toast(b.roaster+' kommt auf deine Einkaufsliste');break;
    case 'activate': S.beans.forEach(function(x){x.active=false;});b.active=true;save();render(true);toast(b.name+' ist jetzt im Trichter');break;
    case 'open': if(b.status==='frozen'){b.frozen=Math.max(0,b.frozen-1);toast('1 Dose aufgetaut · '+b.frozen+' übrig');if(b.frozen===0)b.status='open';}else{b.status='open';b.remaining=b.remaining||b.weight;}
      if(b.status==='open'){S.beans.forEach(function(x){x.active=false;});b.active=true;}save();render(true);break;
    case 'shot': startShot(v);break;
    case 'shotcancel': cancelAnimationFrame(raf);UI.shot=null;UI.route=UI.prev||'home';render();break;
    case 'ttoggle': var s=UI.shot;if(s.run){s.run=false;cancelAnimationFrame(raf);}else{s.run=true;s.saved=false;s.t0=performance.now()-s.t*1000;}render(true);if(s.run)raf=requestAnimationFrame(tick);break;
    case 'treset': cancelAnimationFrame(raf);UI.shot.run=false;UI.shot.t=0;UI.shot.saved=false;render(true);break;
    case 'step': var sh=UI.shot,k=v,d=+el.getAttribute('data-d');sh[k]=Math.round((sh[k]+d)*100)/100;sh.saved=false;render(true);break;
    case 'taste': UI.shot.taste=+v;UI.shot.saved=false;render(true);break;
    case 'shotsave': shotSave();break;
    case 'adopt': var sh2=UI.shot,bb=bean(sh2.bean),rr=bb.recipes[0];rr.grind=sh2.grind;rr.dose=sh2.dose;rr.out=sh2.out;rr.temp=sh2.temp;save();toast('Rezept aktualisiert');UI.shot=null;UI.route='bean';UI.beanId=bb.id;render();break;
    case 'done': var t=S.tasks.find(function(x){return x.id===v;});if(t.unit==='d')t.last=TODAY.toISOString().slice(0,10);else t.lastKg=S.machine.kg;save();render(true);toast(t.name+' erledigt');break;
    case 'bfilter': UI.beanFilter=v;render(true);break;
    case 'mapmode': UI.mapMode=v;UI.mapSel=null;UI.vb=null;render(true);break;
    case 'pin': var svg=document.getElementById('mapsvg');if(svg&&svg._justDragged)return;UI.mapSel=v;render(true);break;
    case 'zoom': zoom(+v);break;
    case 'fit': UI.vb=fitView(mapPins(),UI.mapMode==='discover'&&UI.discFilter==='near'?2.2:120);applyVB();break;
    case 'saverec': S.saved[v]=!S.saved[v];save();render(true);toast(S.saved[v]?'Auf der Merkliste':'Von der Merkliste entfernt');break;
    case 'cafefilter': UI.cafeFilter=v;if(UI.discFilter==='near'){UI.vb=null;UI.mapSel=null;}render(true);break;
    case 'discfilter': UI.discFilter=v;UI.mapSel=null;UI.vb=null;render(true);break;
    case 'focus': var kind={c:'near',r:'recs',t:'travel'}[v[0]];if(UI.discFilter!==kind){UI.discFilter=kind;UI.vb=null;}UI.mapSel=v;render(true);var mw=document.getElementById('mapwrap');if(mw)mw.scrollIntoView({behavior:'smooth',block:'center'});break;
    case 'measure': toast('Messwert per Teststreifen eintragen – im Prototyp noch nicht ausgebaut');break;
    case 'reset': S=seed();save();UI.route='home';render();toast('Beispieldaten wiederhergestellt');break;
    case 'theme': var r=document.documentElement,cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.setAttribute('data-theme',cur==='dark'?'light':'dark');break;
    case 'add': UI.addForm={name:'Guji Hambela II',roaster:'Hafenrösterei',country:'Äthiopien',region:'Guji · Uraga',roastDate:'2026-09-22',weight:250,price:17.5,notes:'Jasmin, Aprikose, Honig',process:'Washed',city:'Hamburg',how:'vor Ort',scanned:true};UI.prev=UI.route;UI.route='add';render();break;
    case 'proc': UI.addForm.process=v;render(true);break;
    case 'how': UI.addForm.how=v;render(true);break;
    case 'addsave': addSave();break;
  }
});
document.getElementById('app').addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='shotbean'){var nb=bean(t.value),r=nb.recipes[0];var s=UI.shot;s.bean=nb.id;if(r){s.grind=r.grind;s.dose=r.dose;s.out=r.out;s.temp=r.temp;}render(true);}
  else if(t.dataset.f&&UI.addForm){UI.addForm[t.dataset.f]=t.value;if(t.tagName==='SELECT')render(true);}
  else if(t.id==='labelimg'&&t.files&&t.files[0]){UI.addForm.scanned=true;render(true);toast('Etikett gelesen – bitte Felder prüfen');}
});
document.getElementById('app').addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.f&&UI.addForm)UI.addForm[t.dataset.f]=t.value;});

function shotSave(){
  var s=UI.shot;
  if(s.saved){UI.shot=null;UI.route=UI.prev==='shot'?'home':UI.prev;render();return;}
  if(s.run){s.run=false;cancelAnimationFrame(raf);}
  var b=bean(s.bean);
  S.shots.push({id:'s'+Date.now(),bean:s.bean,recipe:0,date:new Date(TODAY.getTime()+ (Date.now()%3600000)).toISOString(),grind:s.grind,dose:s.dose,out:s.out,time:Math.round(s.t*10)/10,temp:s.temp,taste:s.taste});
  b.remaining=Math.max(0,Math.round((b.remaining-s.dose)*10)/10);
  S.machine.shots++;S.machine.kg=Math.round((S.machine.kg+s.dose/1000)*1000)/1000;
  if(!b.recipes.length)b.recipes.push({name:'Espresso',grind:s.grind,rpm:1200,dose:s.dose,out:s.out,tmin:Math.max(20,Math.round(s.t)-1),tmax:Math.round(s.t)+1||30,temp:s.temp,pre:'–',kit:'Sieb 18 g'});
  s.saved=true;save();render(true);toast('Shot #'+s.no+' gespeichert · '+b.remaining+' g übrig');
}
function addSave(){
  var f=UI.addForm;if(!f.name.trim()){toast('Bitte einen Namen eintragen');return;}
  var c=COUNTRIES[f.country]||[0,0],cp=CITYPOS[f.city]||CITYPOS.Hamburg;
  var id='b'+Date.now(),w=+f.weight||250;
  var nb={id:id,name:f.name.trim(),roaster:f.roaster.trim()||'Unbekannte Rösterei',country:f.country,region:f.region,lat:c[0],lon:c[1],process:f.process,variety:'',altitude:'',roast:'',roastDate:f.roastDate||TODAY.toISOString().slice(0,10),weight:w,remaining:w,price:+f.price||0,
    notes:String(f.notes).split(',').map(function(x){return x.trim();}).filter(Boolean),status:'open',frozen:0,rating:null,rebuy:null,active:false,color:'#43372E',
    shop:{name:f.roaster.trim()||'Rösterei',city:f.city,lat:cp[0],lon:cp[1],how:f.how},
    recipes:[{name:'Espresso',grind:similarGrind(f),rpm:1200,dose:18,out:38,tmin:26,tmax:30,temp:93,pre:'5 s',kit:'Sieb 18 g'}]};
  S.beans.unshift(nb);save();UI.beanId=id;UI.recipeIdx=0;UI.prev='beans';UI.route='bean';render();toast(nb.name+' angelegt');
}

render();
})();
</script>
</body>
