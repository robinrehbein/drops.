<style>
:root{
  --bg:#F3EEE5;--surface:#FBF8F3;--ink:#1E1915;--muted:#62574D;--line:#E0D6C8;--track:#EAE1D4;
  --accent:#A4521E;--accent-ink:#7E3C12;--on-accent:#FBF8F3;
  --hero:#2A211B;--hero-ink:#F6EFE6;--hero-muted:#BFB2A4;--hero-line:#43372E;--hero-accent:#E08A4F;--hero-faint:#8F8275;
  --ok:#3E6A55;--ok-soft:#DCE8DF;--ok-ink:#23473A;--warn:#A4521E;--warn-soft:#F1DFD0;--bad:#9B2C20;--bad-soft:#F4D9D3;
  --ice:#2F5064;--ice-soft:#DDE6EC;--inv:#1E1915;--on-inv:#FBF8F3;
  --sea:#E4EAE8;--land:#F7F2EA;--land-line:#CFC4B4;--belt:rgba(164,82,30,.08);
  --shadow:0 8px 24px rgba(42,33,27,.18);
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#16110E;--surface:#201915;--ink:#F2E9DF;--muted:#AE9F90;--line:#382D26;--track:#2E251F;
  --accent:#E08A4F;--accent-ink:#F0A673;--on-accent:#1E1915;
  --hero:#2B211B;--hero-line:#453830;
  --ok:#7FB39A;--ok-soft:#1F3029;--ok-ink:#A9D3BE;--warn:#E08A4F;--warn-soft:#3A2618;--bad:#E88A7C;--bad-soft:#3A1C18;
  --ice:#9CC0D6;--ice-soft:#1D2A33;--inv:#F2E9DF;--on-inv:#1E1915;
  --sea:#1A2123;--land:#2A221D;--land-line:#4A3E35;--belt:rgba(224,138,79,.10);--shadow:0 8px 24px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16110E;--surface:#201915;--ink:#F2E9DF;--muted:#AE9F90;--line:#382D26;--track:#2E251F;
  --accent:#E08A4F;--accent-ink:#F0A673;--on-accent:#1E1915;
  --hero:#2B211B;--hero-line:#453830;
  --ok:#7FB39A;--ok-soft:#1F3029;--ok-ink:#A9D3BE;--warn:#E08A4F;--warn-soft:#3A2618;--bad:#E88A7C;--bad-soft:#3A1C18;
  --ice:#9CC0D6;--ice-soft:#1D2A33;--inv:#F2E9DF;--on-inv:#1E1915;
  --sea:#1A2123;--land:#2A221D;--land-line:#4A3E35;--belt:rgba(224,138,79,.10);--shadow:0 8px 24px rgba(0,0,0,.45);
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:28px 20px 32px;display:flex;flex-direction:column;gap:20px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-weight:400}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1.title{margin:0;font:400 40px/1 var(--serif);letter-spacing:-.01em;text-wrap:balance}
h2,h3{margin:0}
.h-sec{font-size:15px;font-weight:600}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.link{background:none;border:none;padding:0;color:var(--accent);font-weight:500;font-size:14px;min-height:32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.list>*+*{border-top:1px solid var(--line)}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px}
.hero .eyebrow{color:var(--hero-accent)}
.hero .hm{color:var(--hero-muted)}
.btn{height:52px;border-radius:26px;border:none;padding:0 22px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-hero{background:var(--hero-accent);color:#1E1915}
.btn-ink{background:var(--inv);color:var(--on-inv)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn-ghost-hero{background:transparent;border:1px solid #5A4A3E;color:var(--hero-ink);font-weight:500}
.btn-sm{height:40px;border-radius:20px;padding:0 14px;font-size:13px;font-weight:500}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:transparent;font-size:14px;white-space:nowrap;flex-shrink:0}
.chip[aria-pressed="true"]{background:var(--inv);color:var(--on-inv);border-color:var(--inv);font-weight:500}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--track);border-radius:14px;padding:4px}
.seg button{min-height:44px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-weight:500;font-size:14px;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(42,33,27,.15)}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.ibox{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tabbar{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:none;background:none;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500}
.tabbar button[aria-current="page"]{color:var(--accent)}
.fab{position:absolute;right:20px;bottom:96px;width:60px;height:60px;border-radius:30px;border:none;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:5}
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:11px}
.stat .v{font-family:var(--mono);font-size:18px}
.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--inv);color:var(--on-inv);padding:12px 18px;border-radius:22px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.field{display:flex;flex-direction:column;gap:2px;background:var(--surface);padding:10px 14px}
.field span{font-size:12px;color:var(--muted)}
.field input,.field select{border:none;background:transparent;padding:0;outline:none;font-size:15px;min-height:24px;width:100%}
.fields{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.fields .grid2{gap:1px}
.bag{width:52px;height:64px;border-radius:10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;flex-shrink:0}
.beanrow{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:14px;display:flex;gap:14px;align-items:center}
.tag{padding:6px 12px;border-radius:14px;border:1px solid #5A4A3E;font-size:13px}
.stars{display:flex;gap:2px}
.stars button{width:40px;height:44px;border:none;background:none;padding:0;color:var(--accent);display:flex;align-items:center;justify-content:center}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 14px}
.stepper .btns{display:flex;flex-direction:column;gap:4px}
.stepper .btns button{width:44px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:17px;line-height:1}
.hint{display:flex;gap:12px;align-items:flex-start;background:var(--ok-soft);color:var(--ok-ink);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.4}
.mapwrap{position:relative;height:300px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sea);touch-action:none;overflow:hidden}
.mapwrap svg{width:100%;height:100%;display:block;cursor:grab}
.mapwrap svg:active{cursor:grabbing}
.mapctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;box-shadow:0 2px 6px rgba(42,33,27,.12)}
.maplegend{position:absolute;left:12px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12px;color:var(--muted)}
.bubble{position:absolute;left:12px;bottom:12px;right:64px;background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.pinrow{width:100%;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 10px;border:none;border-radius:14px;background:transparent;text-align:left}
.pinrow[aria-pressed="true"]{background:var(--surface)}
.dot{width:10px;height:10px;border-radius:5px;background:var(--accent);flex-shrink:0}
.pinrow[aria-pressed="true"] .dot{background:var(--inv)}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.rec{width:250px;flex-shrink:0;scroll-snap-align:start;padding:16px;display:flex;flex-direction:column;gap:10px}
.overlay{position:absolute;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function fmt(n,d){d=d==null?1:d;return Number(n).toFixed(d);}

/* ---------- Pflege-Logik ---------- */
function taskState(t){
  var used = t.unit==='d' ? days(new Date(t.last+'T08:00:00'),TODAY) : S.machine.kg - t.lastKg;
  var pct = used/t.every, left=t.every-used;
  var st = pct>=1?'over':pct>=0.8?'soon':'ok';
  var unitWord = t.unit==='d'?(Math.abs(Math.round(left))===1?' Tag':' Tagen'):' kg';
  var status = st==='over'
    ? (t.unit==='d'? Math.round(-left)+(Math.round(-left)===1?' Tag':' Tage')+' über' : de(-left)+' kg über')
    : (t.unit==='d'? (Math.round(left)===0?'heute':'in '+Math.round(left)+unitWord) : 'in '+de(left)+' kg');
  return {t:t,used:used,pct:pct,st:st,status:status};
}
var STCOL={over:['var(--bad)','var(--bad-soft)'],soon:['var(--warn)','var(--warn-soft)'],ok:['var(--ok)','var(--ok-soft)']};
function sortedTasks(){return S.tasks.map(taskState).sort(function(a,b){return b.pct-a.pct;});}

/* ---------- Karten-Projektionen ---------- */
function projW(lat,lon){var r=Math.PI/180;return [GEO.w.t[0]+GEO.w.k*lon*r, GEO.w.t[1]-GEO.w.k*lat*r];}
function projE(lat,lon){var r=Math.PI/180;return [GEO.e.t[0]+GEO.e.k*lon*r, GEO.e.t[1]-GEO.e.k*Math.log(Math.tan(Math.PI/4+lat*r/2))];}

function dialChart(shots){
  var W=320,H=130,pl=34,pr=10,pt=14,pb=26;
  var gs=shots.map(function(s){return s.grind;}),mn=Math.floor(Math.min.apply(0,gs)*2)/2-0.5,mx=Math.ceil(Math.max.apply(0,gs)*2)/2+0.5;
  var x=function(i){return pl+(shots.length===1?0:i*(W-pl-pr)/(shots.length-1));},y=function(g){return pt+(mx-g)/(mx-mn)*(H-pt-pb);};
  var ticks=[mx,(mx+mn)/2,mn];
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Mahlgrad pro Shot, von '+fmt(gs[0])+' bis '+fmt(gs[gs.length-1])+'">';
  ticks.forEach(function(t){s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--track)"/><text x="0" y="'+(y(t)+4)+'" font-family="Geist Mono,monospace" font-size="10" fill="var(--muted)">'+fmt(t)+'</text>';});
  s+='<polyline fill="none" stroke="var(--ink)" stroke-width="1.5" points="'+shots.map(function(sh,i){return x(i)+','+y(sh.grind);}).join(' ')+'"/>';
  shots.forEach(function(sh,i){s+='<circle cx="'+x(i)+'" cy="'+y(sh.grind)+'" r="'+(i===shots.length-1?6:5)+'" fill="'+TASTE_COL[sh.taste]+'"'+(i===shots.length-1?' stroke="var(--ink)" stroke-width="2"':'')+'/>';});
  s+='<text x="'+pl+'" y="'+(H-6)+'" font-family="Geist Mono,monospace" font-size="10" fill="var(--muted)">#1</text><text x="'+(W-pr-14)+'" y="'+(H-6)+'" font-family="Geist Mono,monospace" font-size="10" fill="var(--muted)">#'+shots.length+'</text></svg>';
  var leg=[0,1,2,3,4].filter(function(t){return shots.some(function(sh){return sh.taste===t;});});
  return '<section style="display:flex;flex-direction:column;gap:10px"><div class="between"><h3 class="h-sec">Dial-in · '+shots.length+' Shots</h3><span class="small muted">Mahlgrad je Shot</span></div><div class="card" style="padding:14px 14px 10px">'+s+
    '<div class="row" style="gap:14px;flex-wrap:wrap;font-size:12px;padding-top:6px">'+leg.map(function(t){return '<span class="row" style="gap:6px;color:var(--muted)"><span style="width:8px;height:8px;border-radius:4px;background:'+TASTE_COL[t]+'"></span>'+TASTE[t]+'</span>';}).join('')+'</div></div></section>';
}

function shotHint(s,r){
  var fast=s.t>0&&r&&s.t<r.tmin, slow=r&&s.t>r.tmax;
  var g=s.grind;
  switch(s.taste){
    case 0: return 'Deutlich sauer'+(fast?' und zu schnell':'')+': 1 Stufe feiner mahlen ('+fmt(g-1)+') oder Temperatur +1 °C.';
    case 1: return 'Leicht sauer: beim nächsten Shot 0.5 feiner ('+fmt(g-0.5)+'). Ratio beibehalten.';
    case 2: return slow?'Schmeckt, läuft aber lang. Wenn es so bleibt: 0.25 gröber für mehr Spielraum.':'Treffer. Speichern und als Rezept für diese Bohne übernehmen.';
    case 3: return 'Leicht bitter: 0.5 gröber ('+fmt(g+0.5)+') oder 1–2 g weniger Ertrag.';
    default: return 'Deutlich bitter'+(slow?' und zu lang':'')+': 1 Stufe gröber ('+fmt(g+1)+') und Temperatur −1 °C.';
  }
}
var raf=null;
function tick(){
  var s=UI.shot; if(!s||!s.run)return;

function discoverPins(){
  var f=UI.discFilter,pins=[];

    CAFES.filter(function(c){return UI.cafeFilter==='open'?c.open:c.kind.indexOf(UI.cafeFilter)>=0;}).forEach(function(c){pins.push({id:'c:'+c.name,title:c.name,sub:c.desc,lat:c.lat,lon:c.lon,n:2,kind:c.open?'cafe':'closed'});});
    pins.push({id:'me',title:HOME_POS.label,sub:'Dein Standort (Beispiel)',lat:HOME_POS.lat,lon:HOME_POS.lon,n:0,kind:'me'});
  } else if(f==='recs'){
    RECS.forEach(function(r){pins.push({id:'r:'+r.id,title:r.name,sub:r.roaster+' · '+r.city,lat:r.lat,lon:r.lon,n:3,kind:'rec'});});

  }
  return pins.map(function(p){var q=projE(p.lat,p.lon);p.x=q[0];p.y=q[1];return p;});
}
var PIN_FILL={cafe:'var(--accent)',closed:'var(--muted)',rec:'var(--ok)',travel:'var(--ice)',me:'var(--inv)'};
function mapPins(){
  if(UI.mapMode==='discover') return discoverPins();
  var groups={};
  S.beans.forEach(function(b){
    var k,lat,lon,title,city;
    if(UI.mapMode==='origin'){k=b.country;lat=b.lat;lon=b.lon;title=b.country;}
    else{k=b.shop.city;lat=b.shop.lat;lon=b.shop.lon;title=b.shop.city;}
    if(lat==null)return;
    var g=groups[k]||(groups[k]={id:k,title:title,beans:[],lat:0,lon:0,places:{}});
    g.beans.push(b);g.lat+=lat;g.lon+=lon;
    g.places[UI.mapMode==='origin'?b.region:b.shop.name+' · '+b.shop.how]=1;
  });
  return Object.keys(groups).map(function(k){var g=groups[k];g.lat/=g.beans.length;g.lon/=g.beans.length;
    var p=UI.mapMode==='origin'?projW(g.lat,g.lon):projE(g.lat,g.lon);g.x=p[0];g.y=p[1];g.n=g.beans.length;g.kind='bean';return g;})
    .sort(function(a,b){return b.beans.length-a.beans.length;});
}

function fitView(pins,minW){
  minW=minW||120;
  if(!pins.length) return {x:0,y:0,w:390,h:300};
  var xs=pins.map(function(p){return p.x;}),ys=pins.map(function(p){return p.y;});
  var x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs),y0=Math.min.apply(0,ys),y1=Math.max.apply(0,ys);
  var padX=Math.max((x1-x0)*0.25,minW*0.2),padY=Math.max((y1-y0)*0.25,minW*0.2);
  var w=Math.max(x1-x0+2*padX,minW),h=Math.max(y1-y0+2*padY,minW*300/390),ar=390/300;
  if(w/h>ar)h=w/ar;else w=h*ar;
  return {x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w:w,h:h};
}

  if(s.run){s.run=false;cancelAnimationFrame(raf);}
  var b=bean(s.bean);
  S.shots.push({id:'s'+Date.now(),bean:s.bean,recipe:0,date:new Date(TODAY.getTime()+ (Date.now()%3600000)).toISOString(),grind:s.grind,dose:s.dose,out:s.out,time:Math.round(s.t*10)/10,temp:s.temp,taste:s.taste});
  b.remaining=Math.max(0,Math.round((b.remaining-s.dose)*10)/10);
  S.machine.shots++;S.machine.kg=Math.round((S.machine.kg+s.dose/1000)*1000)/1000;
  if(!b.recipes.length)b.recipes.push({name:'Espresso',grind:s.grind,rpm:1200,dose:s.dose,out:s.out,tmin:Math.max(20,Math.round(s.t)-1),tmax:Math.round(s.t)+1||30,temp:s.temp,pre:'–',kit:'Sieb 18 g'});
  s.saved=true;save();render(true);toast('Shot #'+s.no+' gespeichert · '+b.remaining+' g übrig');
}
function addSave(){
  var f=UI.addForm;if(!f.name.trim()){toast('Bitte einen Namen eintragen');return;}
  var c=COUNTRIES[f.country]||[0,0],cp=CITYPOS[f.city]||CITYPOS.Hamburg;
  var id='b'+Date.now(),w=+f.weight||250;
  var nb={id:id,name:f.name.trim(),roaster:f.roaster.trim()||'Unbekannte Rösterei',country:f.country,region:f.region,lat:c[0],lon:c[1],process:f.process,variety:'',altitude:'',roast:'',roastDate:f.roastDate||TODAY.toISOString().slice(0,10),weight:w,remaining:w,price:+f.price||0,
    notes:String(f.notes).split(',').map(function(x){return x.trim();}).filter(Boolean),status:'open',frozen:0,rating:null,rebuy:null,active:false,color:'#43372E',
    shop:{name:f.roaster.trim()||'Rösterei',city:f.city,lat:cp[0],lon:cp[1],how:f.how},
    recipes:[{name:'Espresso',grind:similarGrind(f),rpm:1200,dose:18,out:38,tmin:26,tmax:30,temp:93,pre:'5 s',kit:'Sieb 18 g'}]};
  S.beans.unshift(nb);save();UI.beanId=id;UI.recipeIdx=0;UI.prev='beans';UI.route='bean';render();toast(nb.name+' angelegt');
}

render();
})();
</script>
